---
layout: archive
title: "Portfolio"
permalink: /portfolio/
author_profile: true
---

<div class="portfolio-grid">
  {% for post in site.portfolio %}
    <a href="{{ post.url }}" class="portfolio-item">
      <div class="portfolio-content">
        <h3>{{ post.title }}</h3>
        {% if post.image %}
          <img src="{{ post.image }}" alt="{{ post.title }}">
        {% endif %}
      </div>
    </a>
  {% endfor %}
</div>
